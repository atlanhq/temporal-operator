name: Publish Operator Image

on:
  push:
    branches:
      - main-0.22-atlan-0.1
  # Build an image and chart from any branch on demand, so a change can be
  # validated on a tenant before it merges. Nothing branch-specific is
  # hardcoded here: the ref chosen when dispatching decides what gets built,
  # and the tags are derived from it.
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get branch name
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
        id: get_branch

      - run: echo "REPOSITORY_NAME=`echo "$GITHUB_REPOSITORY" | awk -F / '{print $2}' | sed -e "s/:refs//"`" >> $GITHUB_ENV
        shell: bash

      - name: Get version tag
        run: echo "version=$(echo `git ls-remote https://github.com/atlanhq/${REPOSITORY_NAME}.git ${{ steps.get_branch.outputs.branch }} | awk '{ print $1}' | cut -c1-7`)" >> $GITHUB_OUTPUT
        id: get_version

      # Slashes are replaced as well as case folded. A tag is built as
      # <repo>-<branch>, so a branch like feat/some-change would otherwise push to
      # a nested path rather than the intended repository.
      - name: Lowercase branch name
        run: echo "lowercase_branch=$(echo '${{ steps.get_branch.outputs.branch }}' | tr '[:upper:]' '[:lower:]' | tr '/' '-')" >> $GITHUB_OUTPUT
        id: get_lowercase_branch

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Generate operator hub bundle
        run: make bundle

      - name: Generate release artifacts
        run: make artifacts

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0 https://github.com/docker/login-action/releases/tag/v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.ORG_PAT_GITHUB }}

      - name: Build and push operator docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/atlanhq/${{ github.event.repository.name }}-${{ steps.get_lowercase_branch.outputs.lowercase_branch }}:latest
            ghcr.io/atlanhq/${{ github.event.repository.name }}-${{ steps.get_lowercase_branch.outputs.lowercase_branch }}:${{ steps.get_version.outputs.version }}

      - name: Build and push bundle docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: bundle.Dockerfile
          push: true
          tags: |
            ghcr.io/atlanhq/${{ github.event.repository.name }}-bundle-${{ steps.get_lowercase_branch.outputs.lowercase_branch }}:latest
            ghcr.io/atlanhq/${{ github.event.repository.name }}-bundle-${{ steps.get_lowercase_branch.outputs.lowercase_branch }}:${{ steps.get_version.outputs.version }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          # Pin to the last release before the Helm 4.x OCI/GHCR push regression
          # (helm/helm#31223, #31600): 4.x fails `helm push` to ghcr.io with
          # `failed to perform "Tag" on destination: ... not found`.
          version: v3.18.6

      - name: Generate operator chart
        run: make helm

      - name: Package and push operator chart to GHCR (OCI)
        run: |
          CHART_VERSION="0.6.0-${{ steps.get_version.outputs.version }}"
          echo "${{ secrets.ORG_PAT_GITHUB }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          helm package charts/temporal-operator --version "$CHART_VERSION" --app-version "v$(cat VERSION)"
          helm push "temporal-operator-${CHART_VERSION}.tgz" oci://${{ env.REGISTRY }}/atlanhq/charts
